[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httpee"
version = "0.1.0"
description = "httpee — thin httpx wrapper for eelang pipelines"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]

[tool.setuptools]
packages = ["httpee"]
